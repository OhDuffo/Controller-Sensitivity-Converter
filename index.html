<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Controller Sensitivity Converter</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; display: flex; justify-content: center; }
    .container { max-width: 850px; width: 100%; background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { margin-top: 0; font-size: 1.6rem; text-align: center; color: #38bdf8; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1.5rem; }
    .card { background: #334155; padding: 1.25rem; border-radius: 8px; }
    
    .game-select { margin-bottom: 1.25rem; }
    .game-select select { font-weight: bold; font-size: 1.05rem; background: #0f172a; color: #38bdf8; border: 2px solid #0284c7; }

    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.35rem; color: #cbd5e1; }
    input, select { width: 100%; padding: 0.65rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 0.95rem; }
    
    .recommendation-box { background: #0284c7; padding: 1.25rem; border-radius: 8px; margin-top: 1.5rem; }
    .rec-title { font-size: 0.85rem; text-transform: uppercase; font-weight: bold; letter-spacing: 0.05em; opacity: 0.95; }
    .rec-list { margin: 0.5rem 0 0 0; padding-left: 1.2rem; font-size: 0.9rem; line-height: 1.5; }
  </style>
</head>
<body>

<div class="container">
  <h1>Controller Sensitivity Converter</h1>
  <p style="text-align: center; color: #94a3b8; font-size: 0.9rem; margin-top: -0.5rem;">
    Dynamic multi-game look sensitivity & response curve translator
  </p>

  <div class="grid">
    <!-- Left Side -->
    <div class="card" id="cardA">
      <div class="field game-select">
        <label for="selectA">Source Game</label>
        <select id="selectA" onchange="initCards(); convert(true);"></select>
      </div>
      <div id="inputsA"></div>
    </div>

    <!-- Right Side -->
    <div class="card" id="cardB">
      <div class="field game-select">
        <label for="selectB">Target Game</label>
        <select id="selectB" onchange="initCards(); convert(true);"></select>
      </div>
      <div id="inputsB"></div>
    </div>
  </div>

  <!-- Dynamic Game Recommendations -->
  <div class="recommendation-box">
    <div class="rec-title">Curve & Acceleration Parity Tips</div>
    <ul class="rec-list" id="recList"></ul>
  </div>
</div>

<script>
  // Game Configuration Database
  const GAME_DATA = {
    cod: {
      name: "Call of Duty",
      h: { min: 0.05, max: 4.00, step: 0.05, default: 1.20, label: "Horizontal Stick Sens (0.05 - 4.00)" },
      v: { min: 0.05, max: 4.00, step: 0.05, default: 1.20, label: "Vertical Stick Sens (0.05 - 4.00)" },
      zoom: { min: 0.05, max: 4.00, step: 0.05, default: 1.00, label: "ADS Sens Multiplier (0.05 - 4.00)" },
      curves: ["Standard", "Linear", "Dynamic"],
      scaleFactor: 166.6667,
      isRatioVertical: false
    },
    finals: {
      name: "THE FINALS",
      h: { min: 0, max: 750, step: 5, default: 200, label: "Look Sens Horizontal (0 - 750)" },
      v: { min: 0, max: 750, step: 5, default: 200, label: "Look Sens Vertical (0 - 750)" },
      zoom: { min: 1, max: 200, step: 1, default: 100, label: "Zoom Sens Multiplier (1% - 200%)" },
      curves: ["Exponential", "Linear", "Sinusoidal"],
      scaleFactor: 1.0,
      isRatioVertical: false
    },
    bf6: {
      name: "Battlefield 6",
      h: { min: 0, max: 100, step: 0.01, default: 20.00, label: "Infantry Aim Sensitivity (0 - 100)" },
      v: { min: 20, max: 180, step: 0.1, default: 100.0, label: "Vertical Aim Ratio (%) (20 - 180)" },
      zoom: { min: 0, max: 300, step: 0.1, default: 100.0, label: "Zoom Sensitivity Coefficient (0 - 300)" },
      curves: ["Standard", "Linear", "BFV (S-Curve)"],
      scaleFactor: 10.0,
      isRatioVertical: true
    }
  };

  // Populate Dropdowns
  function populateSelects() {
    const selA = document.getElementById("selectA");
    const selB = document.getElementById("selectB");
    selA.innerHTML = "";
    selB.innerHTML = "";

    Object.keys(GAME_DATA).forEach(key => {
      const optA = document.createElement("option");
      optA.value = key;
      optA.innerText = GAME_DATA[key].name;
      selA.appendChild(optA);

      const optB = document.createElement("option");
      optB.value = key;
      optB.innerText = GAME_DATA[key].name;
      selB.appendChild(optB);
    });

    selA.value = "cod";
    selB.value = "bf6";
  }

  // Render Card UI based on selected game
  function renderCardUI(side) {
    const gameKey = document.getElementById(`select${side}`).value;
    const g = GAME_DATA[gameKey];
    const container = document.getElementById(`inputs${side}`);

    container.innerHTML = `
      <div class="field">
        <label for="h_${side}">${g.h.label}</label>
        <input type="number" id="h_${side}" min="${g.h.min}" max="${g.h.max}" step="${g.h.step}" value="${g.h.default}" oninput="convert(${side === 'A'})">
      </div>
      <div class="field">
        <label for="v_${side}">${g.v.label}</label>
        <input type="number" id="v_${side}" min="${g.v.min}" max="${g.v.max}" step="${g.v.step}" value="${g.v.default}" oninput="convert(${side === 'A'})">
      </div>
      <div class="field">
        <label for="zoom_${side}">${g.zoom.label}</label>
        <input type="number" id="zoom_${side}" min="${g.zoom.min}" max="${g.zoom.max}" step="${g.zoom.step}" value="${g.zoom.default}" oninput="convert(${side === 'A'})">
      </div>
      <div class="field">
        <label for="curve_${side}">Look Response Curve</label>
        <select id="curve_${side}" onchange="convert(${side === 'A'})">
          ${g.curves.map(c => `<option value="${c}">${c}</option>`).join('')}
        </select>
      </div>
    `;
  }

  function initCards() {
    renderCardUI('A');
    renderCardUI('B');
  }

  // Fixed clamping helper
  function clampStep(val, min, max, step) {
    let stepped = Math.round(val / step) * step;
    let clamped = Math.max(min, Math.min(max, stepped));
    return parseFloat(clamped.toFixed(2));
  }

  // Universal Conversion Engine
  function convert(fromLeft) {
    const srcSide = fromLeft ? 'A' : 'B';
    const tgtSide = fromLeft ? 'B' : 'A';

    const srcKey = document.getElementById(`select${srcSide}`).value;
    const tgtKey = document.getElementById(`select${tgtSide}`).value;

    const srcH = parseFloat(document.getElementById(`h_${srcSide}`).value) || 0;
    const srcV = parseFloat(document.getElementById(`v_${srcSide}`).value) || 0;
    const srcZoom = parseFloat(document.getElementById(`zoom_${srcSide}`).value) || 0;
    const srcCurve = document.getElementById(`curve_${srcSide}`).value;

    const srcG = GAME_DATA[srcKey];
    const tgtG = GAME_DATA[tgtKey];

    if (srcKey === tgtKey) {
      document.getElementById(`h_${tgtSide}`).value = srcH;
      document.getElementById(`v_${tgtSide}`).value = srcV;
      document.getElementById(`zoom_${tgtSide}`).value = srcZoom;
      document.getElementById(`curve_${tgtSide}`).value = srcCurve;
      updateTips(srcKey, tgtKey, srcCurve, srcCurve);
      return;
    }

    // Step 1: Normalize Source inputs to Universal Base Rate (THE FINALS scale)
    let baseH, baseV, baseZoom;

    if (srcG.isRatioVertical) {
      baseH = srcH * srcG.scaleFactor;
      baseV = (srcH * (srcV / 100)) * srcG.scaleFactor;
    } else {
      baseH = srcH * srcG.scaleFactor;
      baseV = srcV * srcG.scaleFactor;
    }

    // Zoom Multiplier Baseline (1.0 = 100%)
    baseZoom = srcKey === "cod" ? srcZoom : srcZoom / 100;

    // Step 2: Convert Universal Base Rate to Target Game Settings
    let tgtH, tgtV, tgtZoom;

    tgtH = baseH / tgtG.scaleFactor;

    if (tgtG.isRatioVertical) {
      tgtV = baseH > 0 ? (baseV / baseH) * 100 : 100;
    } else {
      tgtV = baseV / tgtG.scaleFactor;
    }

    tgtZoom = tgtKey === "cod" ? baseZoom : baseZoom * 100;

    // Step 3: Apply Clamping & Rounding
    document.getElementById(`h_${tgtSide}`).value = clampStep(tgtH, tgtG.h.min, tgtG.h.max, tgtG.h.step);
    document.getElementById(`v_${tgtSide}`).value = clampStep(tgtV, tgtG.v.min, tgtG.v.max, tgtG.v.step);
    document.getElementById(`zoom_${tgtSide}`).value = clampStep(tgtZoom, tgtG.zoom.min, tgtG.zoom.max, tgtG.zoom.step);

    // Curve Matching
    let tgtCurve = tgtG.curves[0];
    if (srcCurve === "Linear" && tgtG.curves.includes("Linear")) {
      tgtCurve = "Linear";
    } else if ((srcCurve === "Dynamic" || srcCurve === "Sinusoidal" || srcCurve === "BFV (S-Curve)")) {
      if (tgtG.curves.includes("BFV (S-Curve)")) tgtCurve = "BFV (S-Curve)";
      else if (tgtG.curves.includes("Sinusoidal")) tgtCurve = "Sinusoidal";
      else if (tgtG.curves.includes("Dynamic")) tgtCurve = "Dynamic";
    }
    document.getElementById(`curve_${tgtSide}`).value = tgtCurve;

    updateTips(srcKey, tgtKey, srcCurve, tgtCurve);
  }

  function updateTips(srcKey, tgtKey, srcCurve, tgtCurve) {
    const recList = document.getElementById("recList");
    
    let tips = [];
    if (srcKey === "bf6" || tgtKey === "bf6") {
      tips.push("Enable <strong>Uniform Infantry Aiming</strong> in Battlefield for consistent FOV zoom scaling.");
      tips.push("Set <strong>Infantry Aiming Acceleration</strong> to 0 (or select a preset with no acceleration) for linear 1:1 parity.");
    }
    if (srcCurve === "Linear" || tgtCurve === "Linear") {
      tips.push("<strong>Linear Match:</strong> Provides unassisted raw 1:1 stick deflection output across both games.");
    } else if (["Dynamic", "Sinusoidal", "BFV (S-Curve)"].includes(srcCurve) || ["Dynamic", "Sinusoidal", "BFV (S-Curve)"].includes(tgtCurve)) {
      tips.push("<strong>S-Curve Match:</strong> Maps reverse-acceleration profiles across titles for fine micro-aim control near stick center.");
    } else {
      tips.push("<strong>Standard Match:</strong> Maps standard exponential power curves between games.");
    }

    recList.innerHTML = tips.map(t => `<li>${t}</li>`).join("");
  }

  // Initialize
  populateSelects();
  initCards();
  convert(true);
</script>

</body>
</html>
